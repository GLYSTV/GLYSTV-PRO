<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10"><title>GLYSTV PRO</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0b10;--card:#161621;--line:#262636;--red:#e50914;--tx:#f2f2f5;--mut:#9a9ab0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:20px}
.logo{font-weight:800;font-size:28px;letter-spacing:1px;text-align:center;margin:28px 0 20px}.logo b{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0f0f18;color:var(--tx);font-size:16px}
button{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--red);color:#fff}
button.sec{background:#262636}button.full{width:100%;margin-top:18px}
.err{color:#ff6b6b;font-size:14px;margin-top:12px;min-height:18px}
.prof{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:18px 0}
.pf{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 8px;text-align:center}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:28px;font-weight:800;background:var(--red)}
.top{position:sticky;top:0;background:var(--bg);padding:12px;border-bottom:1px solid var(--line);z-index:5}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.row button{flex:0 0 auto}
.grid{padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;position:relative}
.ch img{width:100%;height:70px;object-fit:contain;background:#0f0f18;border-radius:8px}
.ch .nm{font-size:13px;margin-top:8px;line-height:1.25;height:33px;overflow:hidden}
.st{position:absolute;top:6px;right:6px;background:#000a;border-radius:50%;width:30px;height:30px;padding:0;font-size:16px;color:#ffd84d}
#pl{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#pl video{flex:1;width:100%;min-height:0;background:#000}
#pl .bar{display:flex;gap:10px;align-items:center;padding:10px;padding-top:calc(10px + env(safe-area-inset-top))}
#pl .bar span{flex:1;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pe{color:#ff6b6b;text-align:center;padding:8px;font-size:14px}
.mut{color:var(--mut);text-align:center;padding:20px}
</style></head><body>
<div id="app"></div>
<div id="pl"><div class="bar"><button class="sec" id="pb">← Volver</button><span id="pn"></span></div><video id="pv" controls autoplay playsinline></video><div id="pe"></div></div>
<script src="hls.min.js"></script>
<script>
const LS={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),app=$('#app');
const S={conf:LS.get('conf',null),profiles:LS.get('profiles',[]),pid:null,chans:[],cats:[],cat:'',q:'',fav:false,lim:120,hls:null};

function login(err){
  const c=S.conf||{};
  app.innerHTML=`<div class="wrap"><div class="logo">GLY<b>STV</b> PRO</div><div class="card">
  <label>Tipo de acceso</label><select id="t"><option value="x">Usuario y contraseña (Xtream)</option><option value="m">Lista M3U (enlace)</option></select>
  <div id="fx"><label>Servidor (ej: http://servidor.com:8080)</label><input id="u" value="${esc(c.url||'')}" autocapitalize="off" autocorrect="off">
  <label>Usuario</label><input id="us" value="${esc(c.user||'')}" autocapitalize="off">
  <label>Contraseña</label><input id="pw" type="password" value="${esc(c.pass||'')}"></div>
  <div id="fm" style="display:none"><label>Enlace de la lista M3U</label><input id="m" value="${esc(c.m3u||'')}" autocapitalize="off"></div>
  <button class="full" id="go">Entrar</button><div class="err" id="er">${esc(err||'')}</div></div></div>`;
  const t=$('#t');t.value=c.type||'x';const sw=()=>{$('#fx').style.display=t.value=='x'?'':'none';$('#fm').style.display=t.value=='m'?'':'none'};sw();t.onchange=sw;
  $('#go').onclick=async()=>{
    const n={type:t.value,url:$('#u').value.trim().replace(/\/+$/,''),user:$('#us').value.trim(),pass:$('#pw').value,m3u:$('#m').value.trim()};
    if(n.type=='x'&&(!n.url||!n.user||!n.pass))return $('#er').textContent='Completa servidor, usuario y contraseña.';
    if(n.type=='m'&&!n.m3u)return $('#er').textContent='Pega el enlace de la lista.';
    if(n.type=='x'&&!/^https?:\/\//.test(n.url))n.url='http://'+n.url;
    $('#go').disabled=true;$('#go').textContent='Conectando...';
    try{await load(n);S.conf=n;LS.set('conf',n);profiles()}catch(e){login('No se pudo conectar: '+(e.message||e))}
  };
}

async function load(c){
  if(c.type=='x'){
    const b=`${c.url}/player_api.php?username=${encodeURIComponent(c.user)}&password=${encodeURIComponent(c.pass)}`;
    const [cs,st]=await Promise.all([fetch(b+'&action=get_live_categories').then(r=>r.json()),fetch(b+'&action=get_live_streams').then(r=>r.json())]);
    if(!Array.isArray(st))throw new Error('usuario o contraseña incorrectos');
    S.cats=(Array.isArray(cs)?cs:[]).map(x=>({id:String(x.category_id),name:x.category_name}));
    S.chans=st.map(x=>({id:'x'+x.stream_id,name:x.name,logo:x.stream_icon,cat:String(x.category_id),url:`${c.url}/live/${encodeURIComponent(c.user)}/${encodeURIComponent(c.pass)}/${x.stream_id}.m3u8`}));
  }else{
    const tx=await fetch(c.m3u).then(r=>r.text());
    if(!tx.includes('#EXTINF'))throw new Error('la lista no es válida');
    const L=tx.split(/\r?\n/),out=[],cats=new Set();let cur=null;
    for(const l of L){
      if(l.startsWith('#EXTINF')){const g=(l.match(/group-title="([^"]*)"/)||[])[1]||'General';const lg=(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'';cur={name:l.split(',').slice(1).join(',').trim()||'Canal',logo:lg,cat:g};cats.add(g)}
      else if(cur&&l.trim()&&!l.startsWith('#')){cur.url=l.trim();cur.id='m'+out.length+cur.name;out.push(cur);cur=null}
    }
    S.cats=[...cats].map(x=>({id:x,name:x}));S.chans=out;
  }
  if(!S.chans.length)throw new Error('la lista no tiene canales');
}

function profiles(){
  if(!S.chans.length){return load(S.conf).then(profiles).catch(e=>login(String(e.message||e)))}
  app.innerHTML=`<div class="wrap"><div class="logo">GLY<b>STV</b> PRO</div><div class="mut" style="padding:0">¿Quién está viendo?</div>
  <div class="prof">${S.profiles.map((p,i)=>`<div class="pf" data-i="${i}"><div class="av">${esc(p[0].toUpperCase())}</div>${esc(p)}</div>`).join('')}
  <div class="pf" id="np"><div class="av" style="background:#262636">+</div>Nuevo perfil</div></div>
  <button class="sec full" id="lo">Cambiar cuenta / cerrar sesión</button></div>`;
  app.querySelectorAll('.pf[data-i]').forEach(e=>e.onclick=()=>{S.pid=S.profiles[e.dataset.i];main()});
  $('#np').onclick=()=>{const n=(prompt('Nombre del perfil')||'').trim();if(n){S.profiles.push(n);LS.set('profiles',S.profiles);profiles()}};
  $('#lo').onclick=()=>{localStorage.removeItem('conf');S.conf=null;S.chans=[];login()};
  if(!S.profiles.length)$('#np').click();
}

const favs=()=>LS.get('fav_'+S.pid,[]);
function main(){
  app.innerHTML=`<div class="top"><div class="row"><input id="q" placeholder="Buscar canal..."><button class="sec" id="pf">${esc(S.pid)}</button></div>
  <div class="row"><select id="ct"><option value="">Todas las categorías</option>${S.cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select><button class="sec" id="fv">★ Favoritos</button></div></div>
  <div class="grid" id="gr"></div><div class="mut" id="mr"></div>`;
  $('#q').oninput=e=>{S.q=e.target.value.toLowerCase();S.lim=120;list()};
  $('#ct').onchange=e=>{S.cat=e.target.value;S.lim=120;list()};
  $('#fv').onclick=()=>{S.fav=!S.fav;$('#fv').style.background=S.fav?'#e50914':'';S.lim=120;list()};
  $('#pf').onclick=()=>profiles();
  list();
}
function list(){
  const F=new Set(favs());
  const r=S.chans.filter(c=>(!S.cat||c.cat==S.cat)&&(!S.q||c.name.toLowerCase().includes(S.q))&&(!S.fav||F.has(c.id)));
  $('#gr').innerHTML=r.slice(0,S.lim).map(c=>`<div class="ch" data-id="${esc(c.id)}"><button class="st" data-f="${esc(c.id)}">${F.has(c.id)?'★':'☆'}</button>${c.logo?`<img loading="lazy" src="${esc(c.logo)}" onerror="this.style.visibility='hidden'">`:'<img alt="">'}<div class="nm">${esc(c.name)}</div></div>`).join('');
  const m=$('#mr');m.innerHTML=r.length>S.lim?'<button class="sec" id="mm">Ver más</button>':(r.length?'':'No hay canales.');
  if($('#mm'))$('#mm').onclick=()=>{S.lim+=120;list()};
  document.querySelectorAll('.st').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.f,a=favs(),i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);LS.set('fav_'+S.pid,a);list()});
  document.querySelectorAll('.ch').forEach(d=>d.onclick=()=>play(S.chans.find(c=>c.id==d.dataset.id)));
}

function play(c){
  const v=$('#pv');$('#pl').style.display='flex';$('#pn').textContent=c.name;$('#pe').textContent='';stop();
  const bad=()=>$('#pe').textContent='No se pudo reproducir este canal.';
  if(window.Hls&&Hls.isSupported()&&/\.m3u8/.test(c.url)){
    S.hls=new Hls();S.hls.loadSource(c.url);S.hls.attachMedia(v);
    S.hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)bad()});
  }else{v.src=c.url}
  v.onerror=bad;v.play().catch(()=>{});
}
function stop(){const v=$('#pv');if(S.hls){S.hls.destroy();S.hls=null}v.pause();v.removeAttribute('src');v.load()}
$('#pb').onclick=()=>{stop();$('#pl').style.display='none'};
document.addEventListener('backbutton',()=>{if($('#pl').style.display=='flex')$('#pb').click()});

S.conf?profiles():login();
</script></body></html>
