<script>
(()=>{const z=Math.min(2.2,innerWidth/850);if(z>1.12){document.documentElement.style.zoom=z;document.documentElement.style.setProperty('--u',(1/z)+'vh');document.documentElement.style.setProperty('--w',(1/z)+'vw');document.documentElement.classList.add('tv')}})();
const $=s=>document.querySelector(s),enc=encodeURIComponent;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let C=LS.get('conf',null),PF=LS.get('profiles',[]),P=null,D={live:[],cats:[]},S={},R={},hls=null;
const NAV=[['inicio','🏠','Inicio'],['live','📺','TV en Vivo'],['movies','🎬','Películas'],['series','🎞️','Series'],['favs','⭐','Favoritos'],['hist','🕘','Historial'],['rec','⏺️','Grabaciones'],['guide','📅','Guía TV'],['set','⚙️','Ajustes'],['about','ℹ️','Acerca de']];
const TILES=[['TV Nacional','📺','#1f6bff',/nacional|national|local|abierta/i],['Deportes','⚽','#6b2bd9',/deport|sport|f[uú]tbol|soccer|nba|espn/i],['Entretenimiento','🎥','#1c9a3a',/entre|variedad|general|entertain/i],['Música','🎵','#d11a2a',/m[uú]sic|radio/i],['Infantiles','🧒','#f08a00',/infan|kid|ni[nñ]|cartoon|disney|dibujo/i],['Noticias','🌐','#6b3ad9',/notic|news|info/i]];
const BN=['banner1.jpg'];

function tick(){const d=new Date(),h=d.getHours();$('#tm').textContent=`${h%12||12}:${String(d.getMinutes()).padStart(2,'0')} ${h<12?'AM':'PM'}`;$('#dy').textContent=`${d.getDate()} ${['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'][d.getMonth()]}. ${d.getFullYear()}`}
setInterval(tick,30000);tick();

function login(err){
  $('#root').style.display='none';const c=C||{};
  $('#lg').style.display='block';$('#lg').innerHTML=`<div class="lw"><img src="logo.png"><div class="card">
  <label>Tipo de acceso</label><select id="t"><option value="x">Usuario y contraseña (Xtream)</option><option value="m">Lista M3U (enlace)</option></select>
  <div id="fx"><label>Servidor (ej: http://servidor.com:8080)</label><input id="u" value="${esc(c.url||'')}" autocapitalize="off">
  <label>Usuario</label><input id="us" value="${esc(c.user||'')}" autocapitalize="off"><label>Contraseña</label><div class="pww"><input id="pw" type="password" value="${esc(c.pass||'')}"><button type="button" class="eye" id="eye" aria-label="Mostrar contraseña">👁</button></div></div>
  <div id="fm" style="display:none"><label>Enlace de la lista M3U</label><input id="m" value="${esc(c.m3u||'')}" autocapitalize="off"></div>
  <button class="b" id="go" style="width:100%;margin-top:18px">Entrar</button><button class="b s" id="qrb" style="width:100%;margin-top:10px">📱 Ingresar con QR (desde tu teléfono)</button><div class="err" id="er">${esc(err||'')}</div></div></div>`;
  $('#qrb').onclick=qrLogin;$('#eye').onclick=()=>{const i=$('#pw'),h=i.type=='password';i.type=h?'text':'password';$('#eye').textContent=h?'🙈':'👁';$('#eye').setAttribute('aria-label',h?'Ocultar contraseña':'Mostrar contraseña')};const t=$('#t');t.value=c.type||'x';const sw=()=>{$('#fx').style.display=t.value=='x'?'':'none';$('#fm').style.display=t.value=='m'?'':'none'};sw();t.onchange=sw;
  $('#go').onclick=async()=>{
    const n={type:t.value,url:$('#u').value.trim().replace(/\/+$/,''),user:$('#us').value.trim(),pass:$('#pw').value,m3u:$('#m').value.trim()};
    if(n.type=='x'&&(!n.url||!n.user||!n.pass))return $('#er').textContent='Completa servidor, usuario y contraseña.';
    if(n.type=='m'&&!n.m3u)return $('#er').textContent='Pega el enlace de la lista.';
    if(n.type=='x'&&!/^https?:\/\//.test(n.url))n.url='http://'+n.url;
    $('#go').disabled=true;$('#go').textContent='Conectando...';
    try{C=n;await load();LS.set('conf',n);profiles()}catch(e){login('No se pudo conectar: '+(e.message||e))}
  };
}
const api=(a,x='')=>fetch(`${C.url}/player_api.php?username=${enc(C.user)}&password=${enc(C.pass)}&action=${a}${x}`).then(r=>r.json());
async function load(){
  D={live:[],cats:[]};
  if(C.type=='x'){
    const [cs,st]=await Promise.all([api('get_live_categories'),api('get_live_streams')]);
    if(!Array.isArray(st))throw new Error('usuario o contraseña incorrectos');
    D.cats=(Array.isArray(cs)?cs:[]).map(x=>({id:String(x.category_id),name:x.category_name}));
    D.live=st.map(x=>({id:'l'+x.stream_id,name:x.name,logo:x.stream_icon,type:'live',cat:String(x.category_id),url:`${C.url}/live/${enc(C.user)}/${enc(C.pass)}/${x.stream_id}.m3u8`}));
  }else{
    const tx=await fetch(C.m3u).then(r=>r.text());if(!tx.includes('#EXTINF'))throw new Error('la lista no es válida');
    const cats=new Set();let cur=null;D.vod=[];D.series=[];
    for(const l of tx.split(/\r?\n/)){
      if(l.startsWith('#EXTINF')){const g=(l.match(/group-title="([^"]*)"/)||[])[1]||'General';cur={name:l.split(',').slice(1).join(',').trim()||'Canal',logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||'',cat:g,type:'live'};cats.add(g)}
      else if(cur&&l.trim()&&!l.startsWith('#')){cur.url=l.trim();cur.id='l'+D.live.length;D.live.push(cur);cur=null}
    }
    D.cats=[...cats].map(x=>({id:x,name:x}));
  }
  if(!D.live.length)throw new Error('la lista no tiene canales');
}
const catList=a=>Array.isArray(a)?a.map(x=>({id:String(x.category_id),name:x.category_name})):[];

function qrMake(text){
  const D=new TextEncoder().encode(text),ECC=[-1,10,16,26,18,24,16,18,22,22,26],NB=[-1,1,1,1,2,2,4,4,4,5,5];
  const nAl=v=>v==1?0:Math.floor(v/7)+2;
  const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const a=nAl(v);r-=(25*a-10)*a-55;if(v>=7)r-=36}return r};
  const ndc=v=>Math.floor(raw(v)/8)-ECC[v]*NB[v];
  let ver=1;for(;ver<=10;ver++){if(4+(ver<10?8:16)+8*D.length<=ndc(ver)*8)break}
  if(ver>10)throw new Error('texto largo');
  const bits=[],push=(x,n)=>{for(let i=n-1;i>=0;i--)bits.push((x>>>i)&1)};
  push(4,4);push(D.length,ver<10?8:16);D.forEach(b=>push(b,8));
  const cap=ndc(ver)*8;push(0,Math.min(4,cap-bits.length));push(0,(8-bits.length%8)%8);
  const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
  for(let p=0xEC;data.length<ndc(ver);p^=0xEC^0x11)data.push(p);
  const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
  const el=ECC[ver],nb=NB[ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb);

  for(let i=0;i<N;i++){sf(6,i,i%2==0);sf(i,6,i%2==0)}
  const fnd=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<N&&yy>=0&&yy<N)sf(xx,yy,d!=2&&d!=4)}};
  fnd(3,3);fnd(N-4,3);fnd(3,N-4);
  const na=nAl(ver),pos=[];if(na){const st=ver==32?26:Math.ceil((ver*4+4)/(na*2-2))*2;pos.push(6);for(let p=N-7;pos.length<na;p-=st)pos.splice(1,0,p)}
  pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i==0&&j==0)||(i==0&&j==na-1)||(i==na-1&&j==0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}));
  const fmt=m=>{let r=m;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((m<<10)|r)^0x5412;
    for(let i=0;i<=5;i++)sf(8,i,bit(b,i));sf(8,7,bit(b,6));sf(8,8,bit(b,7));sf(7,8,bit(b,8));for(let i=9;i<15;i++)sf(14-i,8,bit(b,i));

  const pen=()=>{let p=0,dark=0;for(let y=0;y<N;y++){let rr=1,cr=1;for(let x=0;x<N;x++){if(M[y][x])dark++;if(x>0){if(M[y][x]==M[y][x-1]){rr++;if(rr==5)p+=3;else if(rr>5)p++}else rr=1;if(M[x][y]==M[x-1][y]){cr++;if(cr==5)p+=3;else if(cr>5)p++}else cr=1}

    const t=N*N;p+=(Math.ceil(Math.abs(dark*20-t*10)/t)-1)*10;return p};
  let best=0,bp=1e9;for(let m=0;m<8;m++){mk(m);fmt(m);const p=pen();if(p<bp){bp=p;best=m}mk(m)}

function qrSvg(text){const M=qrMake(text),n=M.length+8;let d='';M.forEach((r,y)=>r.forEach((v,x)=>{if(v)d+=`M${x+4},${y+4}h1v1h-1z`}));

const PAGES='https://glystv.github.io/GLYSTV-PRO/qr.html';
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function qrDec(msg,key){const k=await crypto.subtle.importKey('raw',unb64(key),'AES-GCM',false,['decrypt']),b=unb64(msg);return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12))))}
async function qrWait(room,key,stop){
  while(!stop.v){
    try{const t=await(await fetch(`https://ntfy.sh/glystv-${room}/json?poll=1&since=all`)).text();
      for(const l of t.split('\n')){if(!l.trim())continue;let j;try{j=JSON.parse(l)}catch(e){continue}if(j.event==='message'){try{return await qrDec(j.message,key)}catch(e){}}}}catch(e){}
    await new Promise(r=>setTimeout(r,3000));
  }
  return null;
}
async function qrLogin(){
  if(!(window.crypto&&crypto.subtle))return $('#er').textContent='El ingreso por QR no está disponible en este dispositivo.';
  const A='abcdefghjkmnpqrstuvwxyz23456789',room=Array.from(crypto.getRandomValues(new Uint8Array(8)),x=>A[x%A.length]).join(''),key=b64(crypto.getRandomValues(new Uint8Array(16))),url=`${PAGES}#r=${room}&k=${key}`,stop={v:false};
  $('#lg').innerHTML=`<div class="lw" style="max-width:760px"><div class="card qrl"><div class="qa"><div id="qrw" data-u="${esc(url)}" style="width:min(230px,calc(60*var(--u,1vh)));aspect-ratio:1;border-radius:8px;overflow:hidden">${qrSvg(url)}</div></div><div class="qb"><img src="logo.png"><div style="font-weight:700">Escanea con la cámara de tu teléfono</div><div class="mut" id="qs" style="padding:6px">Esperando los datos de tu cuenta...</div><div style="font-size:11px;color:var(--mut);word-break:break-all">${esc(PAGES)}</div><button class="b s" id="qc" style="margin-top:10px">Cancelar</button></div></div></div>`;

  if(n.type=='x'&&n.url&&!/^https?:\/\//.test(n.url))n.url='http://'+n.url;
