name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          unzip -o GLYSTV-PRO.zip -x ".github/workflows/*"
          rm GLYSTV-PRO.zip
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Descomprimir proyecto" || true
          git push
