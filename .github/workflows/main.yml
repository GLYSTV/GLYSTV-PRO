name: Descomprimir ZIP
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "::error::No hay ningún .zip en la raíz del repositorio."; exit 1; fi
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q -o "$ZIP" -x "*__MACOSX*" -d /tmp/x
          SRC=/tmp/x
          if [ "$(ls -A /tmp/x | wc -l)" = "1" ] && [ -d "/tmp/x/$(ls -A /tmp/x)" ]; then SRC="/tmp/x/$(ls -A /tmp/x)"; fi
          rm -rf "$SRC/.github/workflows"
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          ls -A
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Descomprimir proyecto" || echo "Sin cambios"
          git push
