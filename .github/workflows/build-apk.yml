name: GLYSTV-PRO - Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Crear GLYSTV-PRO Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK 36
        run: |
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          if [ ! -x "$SDKM" ]; then SDKM="$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)"; fi
          echo "Usando sdkmanager en: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Pillow
        run: pip install Pillow

      - name: Instalar dependencias
        run: npm install

      - name: Número de compilación (siempre mayor que las versiones anteriores)
        run: echo "BN=$((${{ github.run_number }} + 1000))" >> "$GITHUB_ENV"

      # Firma fija con secrets de GitHub (ninguna contraseña ni llave vive en el repositorio).
      # Secrets del repositorio: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Restaurar firma fija de la APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Faltan secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (Settings > Secrets and variables > Actions). Sin llave fija no se compila."
            exit 1
          fi
          KS="$RUNNER_TEMP/glystv.jks"
          # Quita espacios y saltos de línea por si el secreto se pegó con ellos.
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KS"
          keytool -list -v -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/ks.txt" \
            || { echo "::error::No se pudo leer la llave: revisa KEYSTORE_PASSWORD y KEY_ALIAS."; exit 1; }
          KS_FP=$(grep 'SHA256:' "$RUNNER_TEMP/ks.txt" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          rm -f "$RUNNER_TEMP/ks.txt"
          echo "Huella SHA-256 de la clave fija: $KS_FP"
          echo "KS_FP=$KS_FP" >> "$GITHUB_ENV"
          echo "GLYSTV_KEYSTORE=$KS" >> "$GITHUB_ENV"

      # Reintenta hasta 3 veces: Maven/Google a veces responden 429 (temporal).
      - name: Compilar GLYSTV-PRO
        env:
          BUILD_NUMBER: ${{ env.BN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ok=0
          for i in 1 2 3; do
            if bash build-glystv.sh; then ok=1; break; fi
            echo "::warning::Intento $i falló, reintentando en 90 s..."
            sleep 90
          done
          [ "$ok" = 1 ]

      - name: Renombrar APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GLYSTV-PRO.apk

      - name: Verificar que la APK lleva la firma fija
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK_FP=$("$APKSIGNER" verify --print-certs GLYSTV-PRO.apk | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-F' 'a-f')
          echo "Huella de la clave fija : $KS_FP"
          echo "Huella firmada en la APK: $APK_FP"
          if [ "$APK_FP" != "$KS_FP" ]; then
            echo "::error::La APK NO está firmada con la clave fija. No se publica."
            exit 1
          fi
          echo "OK: la APK usa la firma fija."

      - name: Verificar que la APK no es depurable
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT2" dump badging GLYSTV-PRO.apk | grep -q "application-debuggable"; then
            echo "::error::La APK sigue siendo depurable. No se publica."
            exit 1
          fi
          echo "OK: la APK no es depurable."

      - name: Guardar registro de errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GLYSTV-PRO-ERRORES
          path: /tmp/gradle1.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Descargar APK GLYSTV-PRO
        uses: actions/upload-artifact@v4
        with:
          name: GLYSTV-PRO
          path: GLYSTV-PRO.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar Release GLYSTV-PRO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glystv-pro-${{ env.BN }}
          name: GLYSTV-PRO v2.0 build ${{ env.BN }}
          files: GLYSTV-PRO.apk
          make_latest: true

          
