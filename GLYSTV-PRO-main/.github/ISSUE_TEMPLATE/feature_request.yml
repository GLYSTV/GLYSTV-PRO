name: ✨ Propuesta de mejora
description: Una idea o función nueva
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: ¿Qué problema resuelve?
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: ¿Cómo te gustaría que funcionara?
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has considerado
